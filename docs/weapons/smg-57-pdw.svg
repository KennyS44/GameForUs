<text x="389" y="183" class="call" style="text-anchor:middle">посадка на планку</text>
<text x="434" y="162" class="call" style="text-anchor:middle">коллиматор — сменный</text>
<text x="479" y="141" class="call" style="text-anchor:middle">магазин 50 патронов, лежит горизонтально</text>
<text x="669" y="204" class="call" style="text-anchor:middle">корпус — единая полимерная оболочка</text>
