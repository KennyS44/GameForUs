<text x="104" y="649.2" class="note">— Ширина коробки 44 мм, цевья 58 мм.</text>
<text x="104" y="670.2" class="note">— Ствол 470 мм, магазин 7 патронов, перезарядка по одному.</text>
<text x="104" y="691.2" class="note">— Цевьё ходит вдоль трубки магазина на 90 мм — при анимации это единственная подвижная деталь снаружи.</text>
<text x="104" y="712.2" class="note">— На коробке планка: коллиматор ставится низко, прямо над осью ствола.</text>
