<text x="104" y="708" class="note">— Ширина по стволам 46 мм, по колодке 44 мм.</text>
<text x="104" y="729" class="note">— Стволы 300 мм, спарены вертикально: в профиле видна двойная толщина.</text>
<text x="104" y="750" class="note">— Прицела штатно нет — на колодке короткая планка под микро-коллиматор.</text>
<text x="104" y="771" class="note">— Приклада нет: отдача уходит в кисть, стрельба только от бедра или навскидку.</text>
