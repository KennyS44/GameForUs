<text x="291.5" y="204" class="call" style="text-anchor:middle">два ствола, спарены вертикально, 300 мм</text>
<text x="514.3" y="183" class="call" style="text-anchor:middle">короткая планка под микро-прицел</text>
<text x="529" y="204" class="call" style="text-anchor:middle">посадка на планку</text>
<text x="552.8" y="162" class="call" style="text-anchor:middle">микро-коллиматор — сменный</text>
<text x="554" y="141" class="call" style="text-anchor:middle">колодка, переломная</text>
<text x="111.5" y="570" class="call" style="text-anchor:start">срез стволов — без дульного устройства</text>
<text x="189" y="591" class="call" style="text-anchor:middle">тактический фонарь</text>
<text x="324" y="591" class="call" style="text-anchor:middle">цевьё</text>
<text x="599" y="570" class="call" style="text-anchor:middle">пистолетная рукоять, приклада нет</text>
