<text x="104" y="70" class="code">SG-12M</text>
<text x="210" y="70" class="title">Самозарядное ружьё 12 калибра с коробчатым магазином</text>
<text x="104" y="94" class="subtitle">Быстрый огонь и быстрая смена магазина, но отдача уводит ствол сильнее помпы. Самый крупный магазин в наборе.</text>
