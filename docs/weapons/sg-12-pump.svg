<text x="128.5" y="204" class="call" style="text-anchor:start">дульная насадка для выбивания замков</text>
<text x="594.7" y="204" class="call" style="text-anchor:middle">верхняя планка Пикатинни, шаг 10 мм</text>
<text x="602.6" y="183" class="call" style="text-anchor:middle">посадка на планку</text>
<text x="640.2" y="162" class="call" style="text-anchor:middle">коллиматор — сменный</text>
<text x="656.9" y="141" class="call" style="text-anchor:middle">ствольная коробка</text>
<text x="988.3" y="204" class="call" style="text-anchor:middle">приклад с щекой, регулируемый</text>
<text x="205.6" y="490.2" class="call" style="text-anchor:middle">тактический фонарь</text>
<text x="316.6" y="511.2" class="call" style="text-anchor:middle">цевьё, ход 90 мм</text>
<text x="334.5" y="532.2" class="call" style="text-anchor:middle">подствольный магазин, 7 патронов</text>
<text x="559.3" y="490.2" class="call" style="text-anchor:middle">окно выброса снизу</text>
<text x="724.9" y="490.2" class="call" style="text-anchor:middle">пистолетная рукоять</text>
<text x="1012.8" y="490.2" class="call" style="text-anchor:middle">антабка ремня</text>
