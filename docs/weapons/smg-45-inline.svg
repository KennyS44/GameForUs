<text x="104" y="886.5" class="note">— Ширина коробки 48 мм, цевья 50 мм, магазина 30 мм.</text>
<text x="104" y="907.5" class="note">— Ствол всего 140 мм: оружие ближнего боя, урон падает уже на 20 м.</text>
<text x="104" y="928.5" class="note">— Коробка выше обычной на 15 мм — внутри вертикальный ход затвора.</text>
<text x="104" y="949.5" class="note">— Приклад складывается вбок; в сложенном виде габарит 470 мм.</text>
