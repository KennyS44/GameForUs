<text x="104" y="70" class="code">SG-12D</text>
<text x="210" y="70" class="title">Обрез двуствольный, 12 калибр</text>
<text x="104" y="94" class="subtitle">Два выстрела и всё. Достаётся мгновенно, вышибает дверь с одного попадания, перезарядка долгая и открытая.</text>
