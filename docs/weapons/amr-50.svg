<text x="142.3" y="183" class="call" style="text-anchor:start">дульный тормоз, три пары окон</text>
<text x="298.9" y="162" class="call" style="text-anchor:middle">кожух ствола с отверстиями</text>
<text x="331.2" y="141" class="call" style="text-anchor:middle">верхняя планка Пикатинни, шаг 10 мм</text>
<text x="578.9" y="183" class="call" style="text-anchor:middle">оптика — сменная</text>
<text x="667" y="162" class="call" style="text-anchor:middle">верхняя коробка</text>
<text x="779.7" y="183" class="call" style="text-anchor:middle">откат ствола с коробкой 25 мм</text>
<text x="968.1" y="162" class="call" style="text-anchor:middle">приклад с амортизатором и щекой</text>
<text x="207.9" y="560.7" class="call" style="text-anchor:middle">тактический фонарь</text>
<text x="311.9" y="581.7" class="call" style="text-anchor:middle">сошки складные</text>
<text x="313.8" y="602.7" class="call" style="text-anchor:middle">цевьё с сошечным узлом</text>
