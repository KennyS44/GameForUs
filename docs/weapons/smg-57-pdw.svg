  .subtitle { font: 14px system-ui, sans-serif; fill: #4d4a45; }
  .note { font: 13px system-ui, sans-serif; fill: #3d3f45; }
  .scalebar { fill: #22242a; }
  .scaletext { font: 11px ui-monospace, monospace; fill: #6b6660; }
</style>
