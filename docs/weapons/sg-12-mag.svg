<text x="278.9" y="162" class="call" style="text-anchor:middle">верхняя планка Пикатинни, шаг 10 мм</text>
<text x="304.2" y="141" class="call" style="text-anchor:middle">газовый узел с регулятором</text>
<text x="508.3" y="183" class="call" style="text-anchor:middle">посадка на планку</text>
<text x="548.3" y="162" class="call" style="text-anchor:middle">коллиматор — сменный</text>
<text x="563.6" y="141" class="call" style="text-anchor:middle">ствольная коробка</text>
<text x="684.5" y="183" class="call" style="text-anchor:middle">антабка ремня</text>
<text x="974.7" y="183" class="call" style="text-anchor:middle">приклад складной, с щекой</text>
<text x="200.1" y="611.3" class="call" style="text-anchor:middle">тактический фонарь</text>
<text x="279.1" y="632.3" class="call" style="text-anchor:middle">цевьё, слоты M-LOK</text>
<text x="352.2" y="653.3" class="call" style="text-anchor:middle">передняя тактическая рукоять</text>
