<text x="258.2" y="183" class="call" style="text-anchor:middle">верхняя планка Пикатинни, шаг 10 мм</text>
<text x="406.5" y="204" class="call" style="text-anchor:middle">посадка на планку</text>
<text x="455.3" y="183" class="call" style="text-anchor:middle">коллиматор — сменный</text>
<text x="476.8" y="162" class="call" style="text-anchor:middle">ствольная коробка</text>
