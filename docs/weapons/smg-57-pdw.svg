<text x="366" y="848" class="scaletext" style="text-anchor:start">200 мм · сетка 50 мм · масштаб 1.25 px/мм</text>
<text x="104" y="728" class="note">— Ширина корпуса 55 мм, магазина 40 мм — самый широкий ствол в наборе.</text>
<text x="104" y="749" class="note">— Ствол 263 мм при полной длине 500 мм: буллпап, коробка позади рукояти.</text>
<text x="104" y="770" class="note">— Корпус — единая полимерная оболочка: моделируй как одну деталь, металл только ствол и планка.</text>
<text x="104" y="791" class="note">— Патроны в магазине лежат поперёк и разворачиваются подавателем — виден ряд гильз сверху.</text>
